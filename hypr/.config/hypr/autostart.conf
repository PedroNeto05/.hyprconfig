# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = waybar
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store -max-items 500
exec-once = wl-paste --type image --watch cliphist store -max-items 500
exec-once = hyprpaper
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprsunset
# corectrl so e instalado em desktop com GPU AMD (ver PKG_GPU_TUNING_AMD); o
# teste evita um erro de startup em notebook ou em maquina Intel/NVIDIA.
exec-once = sh -c 'command -v corectrl >/dev/null && corectrl --minimize-systray'

# Vigia a remocao de monitor com a tampa fechada (ver monitor-guard.sh).
# Em desktop o script sai imediatamente, por nao haver painel interno.
exec-once = ~/.myscripts/hypr/monitor-guard.sh
