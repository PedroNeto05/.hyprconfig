# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = waybar
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store -max-items 500
exec-once = wl-paste --type image --watch cliphist store -max-items 500
exec-once = hyprpaper
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprsunset
# corectrl so e instalado em desktop com GPU AMD (ver PKG_GPU_TUNING_AMD); o
# teste evita um erro de startup em notebook ou em maquina Intel/NVIDIA.
exec-once = sh -c 'command -v corectrl >/dev/null && corectrl --minimize-systray'

# Vigia a remocao de monitor com a tampa fechada (ver monitor-guard.sh).
# Em desktop o script sai imediatamente, por nao haver painel interno.
exec-once = ~/.myscripts/hypr/monitor-guard.sh

# Daemon do ditado por voz (ver modules/post/04_voxtype.sh). Sobe aqui e nao pela
# unit systemd do pacote: sem uwsm o graphical-session.target nunca fica ativo, e
# o daemon precisa herdar WAYLAND_DISPLAY (wtype) e HYPRLAND_INSTANCE_SIGNATURE (hyprctl).
exec-once = sh -c 'command -v voxtype >/dev/null && voxtype -q daemon'
