# Configuracoes de notebook.
#
# Este arquivo e sempre carregado (sourced no fim do hyprland.conf, depois do
# keybinds.conf para que $mainMod ja exista). Em desktop tudo aqui e no-op: nao
# ha "Lid Switch" nem teclas XF86Kbd*, entao nada casa.

# --- Tampa (lid switch) ------------------------------------------------------
# Ao fechar a tampa desliga apenas o painel interno; se houver monitor externo a
# sessao continua nele. Sem monitor externo quem decide suspender e o
# systemd-logind (/etc/systemd/logind.conf.d/90-laptop-lid.conf, ver
# modules/post/03_laptop.sh). bindl dispara mesmo com a sessao bloqueada.
bindl = , switch:on:Lid Switch, exec, ~/.myscripts/hypr/lid.sh close
bindl = , switch:off:Lid Switch, exec, ~/.myscripts/hypr/lid.sh open

# --- Economia de energia -----------------------------------------------------
# VFR (reduzir redesenho com a tela parada) deixou de ser opcao a partir do
# Hyprland 0.5x: hoje e sempre ativo. Sobrou o VRR/adaptive sync, aplicado
# apenas onde o painel anuncia suporte.
misc {
    vrr = 1
}

# --- Teclas de hardware extras de notebook -----------------------------------
# Retroiluminacao do teclado (quando exposta como led "*::kbd_backlight").
bindel = , XF86KbdBrightnessUp, exec, brightnessctl -d "*::kbd_backlight" set +33%
bindel = , XF86KbdBrightnessDown, exec, brightnessctl -d "*::kbd_backlight" set 33%-

# Tecla de modo aviao e tecla de suspender.
bindl = , XF86RFKill, exec, rfkill toggle all
bindl = , XF86Sleep, exec, systemctl suspend

# Alterna o perfil de energia (mesma acao do clique no widget da waybar).
bind = $mainMod SHIFT, P, exec, ~/.config/waybar/scripts/power-profile.sh next
