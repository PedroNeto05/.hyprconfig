general {
	lock_cmd = pidof hyprlock || hyprlock   # evita instancias duplicadas
	before_sleep_cmd = loginctl lock-session
	after_sleep_cmd = ~/.myscripts/hypr/after-sleep.sh   # DPMS on + redesenha o papel de parede
	ignore_dbus_inhibit = false             # respeita o idle_inhibitor da waybar
}

# Escada de ociosidade. Os tempos valem para bateria e tomada; o que muda a
# autonomia de verdade e o DPMS off, que apaga o backlight do painel.

# 2.5 min: escurece a tela como aviso. brightnessctl -s salva o valor atual,
# -r restaura, entao isso nao atrapalha o brilho escolhido manualmente.
listener {
	timeout = 150
	on-timeout = brightnessctl -s set 10%
	on-resume = brightnessctl -r
}

# 2.5 min: apaga a retroiluminacao do teclado, se existir.
listener {
	timeout = 150
	on-timeout = brightnessctl -sd "*::kbd_backlight" set 0
	on-resume = brightnessctl -rd "*::kbd_backlight"
}

# 5 min: bloqueia a sessao.
listener {
	timeout = 300
	on-timeout = loginctl lock-session
}

# 5.5 min: desliga o painel (DPMS off).
listener {
	timeout = 330
	on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
	on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspende. Em notebook e o que evita gastar a bateria na mochila; em
# desktop e inofensivo (basta mexer no mouse para acordar).
listener {
	timeout = 1800
	on-timeout = systemctl suspend
}
