# Reativa o papel HFP AG (o PC como "gateway" de viva-voz) só para que caixas
# como a JBL Xtreme encontrem o serviço Handsfree Audio Gateway no SDP: ao ligar,
# ela procura esse serviço e desconecta se não achar (visto com btmon).
# Substitui o antigo /etc/wireplumber/wireplumber.conf.d/51-disable-bluez-hfp.conf,
# que desligava o HFP e é removido por modules/post/05_bluetooth.sh.
monitor.bluez.properties = {
  bluez5.hfphsp-backend = "native"
  bluez5.roles = [ a2dp_sink a2dp_source hfp_ag ]
}

# Não trocar sozinho para o perfil de viva-voz (mono 8/16 kHz) quando um app
# abrir o microfone: o áudio fica em A2DP.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

# O PipeWire pede só o HFP ~2 s depois que a caixa conecta. O A2DP fica de fora
# de propósito: quando o PC pede o A2DP, a JBL Xtreme costuma derrubar a
# negociação e o bluetoothd 5.87 pode travar; deixada em paz ela configura o
# A2DP sozinha. Se o A2DP não subir, o bt-a2dp-watchdog (05_bluetooth.sh) pede.
monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf ]
      }
    }
  }
]
